    <script type="text/javascript">

function fetchItems(url) {
  main.innerHTML =
    "<img src='https://upload.wikimedia.org/wikipedia/commons/c/c7/Loading_2.gif' />"
  fetch(url)
    .then(function (res) {
      return res.json()
    })
    .then(function (res) {
      console.log(res)
      res = res.filter(function (item) {
        return item.name.split(".")[0]
      })
      listItems(res)
    })
}
fetchItems(
  "https://script.google.com/macros/s/AKfycbwGNQKWgDKVXYFogoOoTSm3FPWk8ZZGr02rRppTfJ1GyOPZRrltjZS7SNeYWO71QPyf/exec",
)

function listItems(items) {
  main.innerHTML = null
  items.forEach(function (item) {
    var img = document.createElement("IMG")
    img.src =
      "https://lh3.googleusercontent.com/d/" + item.id + "=w500-h500?authuser=0"
    img.style.width = "200px"
    img.onclick = function () {
      if (item.home) {
        fetchItems(
          "https://script.google.com/macros/s/AKfycbwGNQKWgDKVXYFogoOoTSm3FPWk8ZZGr02rRppTfJ1GyOPZRrltjZS7SNeYWO71QPyf/exec?name=" +
            item.name.split(".")[0],
        )
      } else {
        for (let i of document.querySelectorAll("IMG")) {
          i.style.width = "200px"
        }
        this.style.width = "100%"
      }
      audio.src =
        "https://translate.google.com/translate_tts?ie=UTF-8&tl=en&client=tw-ob&q=" +
        item.name.split(".")[0]
      audio.play()
    }
    main.append(img)
  })
}


  </script>

  <script>
    const allLines = []
    const cssElement = document.querySelector("#compiled-css")

    window.addEventListener("message", (message) => {

      if (message.data.css){
        cssElement.textContent = message.data.css.payload
      }

      if (message.data.html){
        document.body.innerHTML = message.data.html.payload
      }
    })

    if (window.parent){
      window.parent.postMessage({loaded: true}, "*")

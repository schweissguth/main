function makeTable() {
  t.innerHTML = null
  ARR.forEach(function(each) {
    const tr = t.insertRow()

    td.onclick = function() {

      postData([
        [each.id, "name", p, Date.now()]
      ])

    }
  })
}

function postData(arr) {

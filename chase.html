<!DOCTYPE html>
<html>

<head>
    <title>Stupid-Fast - Chase</title>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="googlebot" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="./server.js"></script>
    <script src="./api.js"></script>
    <link rel="stylesheet" href="./css.css">

</head>

<body>
    <header><a href="./index.html"><img src="./sfbanner.png" alt="" /></a></header>

    <table id="t" cellpadding="3"></table>

</body>

<script>
    
    getChase().then(async function (res) {
  console.log('res', res)
  res.forEach(function (each, i) {
    let tr = t.insertRow()
    tr.insertCell().innerText = i + 1
    const td = tr.insertCell()
    td.id = each.id
    td.style.fontWeight = 'bold'
    td.innerHTML = each.id
    tr.insertCell().innerText = each.sum
    tr.insertCell().innerHTML =
      '<small><i>' + (each.delta || '') + '</i></small>'
  })
  setTimeout(function () {
    getPlayers().then(function (players) {
      players = Object.entries(players)
      console.log('players', players)
      players.forEach(function (each) {
        document.getElementById(each[0]).innerText = each[1]
      })
    })
  }, 1000)
})


</script>

</html>

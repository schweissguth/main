    <script type="text/javascript">

const playlist = [
  [
    "https://www.dropbox.com/scl/fi/ehuk3iqbbb5occduwam0i/2-01.mp4?rlkey=6pju70ivnp6o04bimrymk9gpy&dl=1",
    1136,
  ],
  [
    "https://www.dropbox.com/scl/fi/xwjwohvqf294lrginnujx/2-02.mp4?rlkey=wjia1jn0h2nrr6alhhwhysxzn&dl=1",
    1296,
  ],
  [
    "https://www.dropbox.com/scl/fi/frr41v1fwbuh6dzgrfpha/2-03.mp4?rlkey=yorl7ozlliytnd3wpfunsngnb&dl=1",
    1296,
  ],
  [
    "https://www.dropbox.com/scl/fi/syuyoxoageei6u436j3m1/2-04.mp4?rlkey=c40aedt6b2hr0o2leff96gyd6&dl=1",
    1328,
  ],
  [
    "https://www.dropbox.com/scl/fi/t0o7g29emoqw2pt9aazy1/2-05.mp4?rlkey=73pplvssx0mhc2bjfk2gsash8&dl=1",
    1309,
  ],
];

let counter = 0;
playlist.forEach(function (each) {
  each[2] = counter;
  each[3] = counter + each[1];
  counter += each[1];
});

  const sum = playlist.reduce(function (total, each) {
    return total + each[1];
  }, 0);

function startVideo() {

  console.log("playlist", playlist);

  const datenow = Math.round(Date.now() / 1000);
  const mod = datenow % sum;
  const find = playlist.find(function (each) {
    return mod > each[2] && mod < each[3];
  });
  console.log("find", find);
  const start = mod - find[2];
  console.log("start", start);

  video.src = find[0];
  video.onloadedmetadata = function () {
    video.currentTime = start;
    video.play();
  };
}
startVideo();

video.addEventListener("ended", () => {
  startVideo();
});


  </script>

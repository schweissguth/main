    <script type="text/javascript">


let str = `1-01.mp4

const folder = "psych"
let arr = str.split("\n")
console.log("arr", arr)
let delta = 0

function init() {
  let start = 0
  arr = arr.map(function(each) {
    //let len = each.split("_").reverse()[0]
    //len = len.split(".")[0]
    //len = parseInt(len)
    let arr = [each, start, start + 21]
    start += 21
    return arr
  })

  console.log("arr", arr)
  console.log("duration", start)
  const datenow = Date.now()/1000/60
  const mod = Math.round(datenow % start)
  console.log("mod", mod)
  const find = arr.find(function(each) {
    return mod > each[1] && mod < each[2]
  })
  console.log("find", find)
  video.src = "https://schweissguth.ngrok.app/" + folder + "/" + find[0]
  delta = mod - find[1]
}

init()

video.addEventListener("canplay", () => {
    video.currentTime = delta*60;
}, {once: true});

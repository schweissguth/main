    <script type="text/javascript">

function init() {
  fetch(
    'https://script.google.com/macros/s/AKfycbwaVr1QigQGAxSe0-moMymnb2K3p9uaCZnZjOkLzPVaNCgqiO5wMYuCOBGMU0VZWMoWtw/exec?' + selectchannel.value,
  )
    .then(function (res) {
      return res.json()
    })
    .then(function (res) {
      console.log(res)
      makeSeek(res.files)
    })
}

init()


function makeSeek(arr) {
  let count = 0
  arr = arr.map(function(each) {
    let split = each.split("_").reverse()[0]
    split = split.split(".mp4")[0]
    split = parseInt(split)
    let newarr = [each, count, count + split]
    count += split
    return newarr
  })
  const datenow = Date.now()/1000/60
  const len = arr[arr.length - 1][2]
  console.log("len", len)
  const mod = datenow % len
  console.log("mod", mod)
  const find = arr.find(function(each) {
    return mod > each[1] && mod < each[2]
  })
  console.log("find", find)
  const delta = Math.floor(mod) - find[1]
  console.log("delta", delta)

  video.src = "https://pub-0a9c78b0cf264bb2bc4e7c47fb221c1f.r2.dev/" + selectchannel.value + "/" + find[0]
  video.oncanplay = () => {
    video.currentTime = delta*60;
    video.oncanplay = null
};


}

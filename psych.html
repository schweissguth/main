    <script type="text/javascript">

fetch("https://schweissguth.ngrok.app/psych/").then(function(res) {
  return res.json()
}).then(function(res) {
  const path = res.path
  console.log(res)
  res = res.items
  let start = 0
  res.forEach(function(each) {
    each.len = each.name.split("_")[1].split(".")[0]
    each.len = Math.round(each.len)
    each.start = start
    each.end = start + each.len
    start += each.len
  })
  console.log("res", res)
  const totallen = res[res.length - 1].end
  console.log("totallen", totallen)
  const mod = Math.round((Date.now()/1000/60) % totallen)
  console.log("mod", mod)
  const find = res.find(function(each) {
    return mod > each.start && mod < each.end
  })
  console.log("find", find)
  const delta = mod - find.start; console.log("delta", delta)
  video.src = "https://schweissguth.ngrok.app" + path + "/" + find.name
    video.addEventListener("loadedmetadata", () => {
      video.currentTime = delta * 60
    });
  video.addEventListener("canplay", () => {
    video.play()
  });


})

  </script>

function init() {
  let start = 0
  let end = 42
  let map = arr.map(function(each) {
    const array = [each, start, end]
    start += 42
    end += 42
    return array
  })
  const last = map[map.length - 1][2]
  console.log(last)
  const date = Date.now()/1000/60
  const mod = Math.round(date % last); console.log("mod", mod)
  const fi = map.findLastIndex(function(each) {
    return mod > each[1]
  }); console.log("find", fi)
  const diff = mod - map[fi][1]; console.log("diff", diff)
  v.src = map[fi][0]
  v.currentTime = diff*60
}

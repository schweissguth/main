  <script>
    const allLines = []
    const cssElement = document.querySelector("#compiled-css")

    // The editor's AI chat asking what the fiddle rendered. Only a selector reaches the
    // DOM API - nothing here evaluates code - and every match is capped, so a page-sized
    // body cannot flood the chat's context.
    const INSPECT_STYLES = ["display", "position", "width", "height", "margin", "padding", "color", "background-color", "font-size", "overflow", "z-index", "visibility", "opacity"]
    const INSPECT_HTML_LIMIT = 3000
    const INSPECT_MAX_MATCHES = 20

    function inspectHtml(element){
      let clone = element.cloneNode(true)

      clone.querySelectorAll("script, style").forEach((node) => node.remove())

      let html = clone.outerHTML.replace(/\s+/g, " ")

      return html.length > INSPECT_HTML_LIMIT ? `${html.slice(0, INSPECT_HTML_LIMIT)}… (truncated)` : html
    }

    function inspect({ id, selector, styles, limit }){
      let elements

      try {
        elements = Array.from(document.querySelectorAll(selector || "body"))
      } catch (error){
        return { id, error: `"${selector}" is not a valid selector.` }
      }

      let shown = Math.min(Math.max(Number(limit) || 5, 1), INSPECT_MAX_MATCHES)

      let matches = elements.slice(0, shown).map((element) => {
        let rect = element.getBoundingClientRect()
        let match = { html: inspectHtml(element), box: [rect.left, rect.top, rect.width, rect.height].map(Math.round) }

        if (styles){
          let computed = getComputedStyle(element)

          match.styles = Object.fromEntries(INSPECT_STYLES.map((name) => [name, computed.getPropertyValue(name)]))
        }

        return match
      })

      return { id, count: elements.length, matches, viewport: [window.innerWidth, window.innerHeight] }
    }

    window.addEventListener("message", (message) => {
      if (message.data && message.data.inspect){
        window.parent.postMessage({ inspect: inspect(message.data.inspect) }, "*")
      }


      if (message.data.css){
        cssElement.textContent = message.data.css.payload
      }

      if (message.data.html){
        document.body.innerHTML = message.data.html.payload
      }
    })

    if (window.parent){
      window.parent.postMessage({loaded: true}, "*")
    }
  </script>

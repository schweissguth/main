<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="zoom: 2;">
<center>

<textarea id="ta" onchange="submitEmail(this.value)" style="width: 90%;" rows="10"></textarea>
<br><br>
<button>Placebo button</button>	
<br><br>
</center>

<script>

function submitEmail(x) {
ta.disabled = true;
fetch("https://script.google.com/macros/s/AKfycbzSDaFKv0kxxSg_L4eRjVruEAle7ckDUWRio45mSST2U_lFSIbiUIzTuJGP5WkTLBeN/exec?" + x).then(function() {
  alert("Submitted");
  ta.value = "";
  ta.disabled = false;
})
}

</script>

</body>
</html>

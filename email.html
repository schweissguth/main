function makeLinks(x) {
  const arr = JSON.parse(x)
  const shuff = []
  arr.forEach(function(each, i) {
    const rand = Math.random()
    const idx = Math.floor(rand * arr.length)
    const spl = arr.splice(idx, 1)
    shuff.push([spl, idx])
  })
  shuff.forEach(function(each) {
    const a = document.createElement("A")
    a.href = each[0]
    a.innerText = each[1]
    a.style.display = "block"
    a.target = "_blank"
    main.append(a)
  })
}
